<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-label="Three at-size color studies for the 640 by 172 ESP32 notification screen">
  <rect width="640" height="588" fill="#111111"/>
  <defs>
    <g id="card">
      <rect x="168" y="8" width="464" height="140" rx="8" fill="#282828"/>
      <rect x="168" y="18" width="3" height="120" rx="1.5" fill="#AFC19E"/>
      <g font-family="DejaVu Sans, sans-serif">
        <text x="180" y="25" fill="#BBD1AB" font-size="13">Claude Code</text>
        <text x="538" y="25" fill="#A8A8A8" font-size="13" text-anchor="end">8m ago</text>
        <text x="180" y="48" fill="#E6E6E6" font-size="19">Review complete</text>
        <g fill="#C8C8C8" font-size="15">
          <text x="180" y="75">We’ve reviewed the notification history</text>
          <text x="180" y="96">and its retention policy. The smaller</text>
          <text x="180" y="117">body shows more of the message.</text>
        </g>
        <text x="180" y="139" fill="#A8A8A8" font-size="11">1 / 3</text>
      </g>
      <rect x="568" y="8" width="64" height="66" rx="8" fill="#30382F" stroke="#536150"/>
      <rect x="568" y="82" width="64" height="66" rx="8" fill="#333333"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M588 43 L612 19 M597 19 H612 V34 M608 43 V52 H586 V30 H595" stroke="#BBD1AB" stroke-width="3"/>
        <path d="M586 100 L614 130 M614 100 L586 130" stroke="#E6E6E6" stroke-width="3"/>
      </g>
    </g>
  </defs>

  <g font-family="DejaVu Sans, sans-serif" font-size="12" fill="#B8B8B8">
    <text x="8" y="17">A · Sage clock, neutral values — recommended</text>
    <text x="8" y="213">B · Warm stone clock, neutral values</text>
    <text x="8" y="409">C · White clock, sage values</text>
  </g>

  <g transform="translate(0 24)">
    <rect width="640" height="172" fill="#181818"/>
    <rect width="159" height="172" fill="#212121"/>
    <rect x="159" width="1" height="172" fill="#424242"/>
    <g font-family="DejaVu Sans, sans-serif">
      <text x="12" y="43" fill="#BBD1AB" font-size="40">14:35</text>
      <g font-size="13">
        <g fill="#A8A8A8">
          <text x="12" y="75">CPU</text><text x="12" y="99">MEM</text>
          <text x="12" y="123">UP</text><text x="12" y="147">DN</text>
        </g>
        <g fill="#D4D4D4" text-anchor="end">
          <text x="105" y="75">3.6G</text><text x="105" y="99">8.4G</text>
          <text x="148" y="75">18%</text><text x="148" y="99">43%</text>
          <text x="148" y="123">86 KB/s</text><text x="148" y="147">2.4 MB/s</text>
        </g>
      </g>
    </g>
    <use href="#card"/>
  </g>

  <g transform="translate(0 220)">
    <rect width="640" height="172" fill="#181818"/>
    <rect width="159" height="172" fill="#212121"/>
    <rect x="159" width="1" height="172" fill="#424242"/>
    <g font-family="DejaVu Sans, sans-serif">
      <text x="12" y="43" fill="#D4C4AA" font-size="40">14:35</text>
      <g font-size="13">
        <g fill="#A8A8A8">
          <text x="12" y="75">CPU</text><text x="12" y="99">MEM</text>
          <text x="12" y="123">UP</text><text x="12" y="147">DN</text>
        </g>
        <g fill="#D4D4D4" text-anchor="end">
          <text x="105" y="75">3.6G</text><text x="105" y="99">8.4G</text>
          <text x="148" y="75">18%</text><text x="148" y="99">43%</text>
          <text x="148" y="123">86 KB/s</text><text x="148" y="147">2.4 MB/s</text>
        </g>
      </g>
    </g>
    <use href="#card"/>
  </g>

  <g transform="translate(0 416)">
    <rect width="640" height="172" fill="#181818"/>
    <rect width="159" height="172" fill="#212121"/>
    <rect x="159" width="1" height="172" fill="#424242"/>
    <g font-family="DejaVu Sans, sans-serif">
      <text x="12" y="43" fill="#E6E6E6" font-size="40">14:35</text>
      <g font-size="13">
        <g fill="#A8A8A8">
          <text x="12" y="75">CPU</text><text x="12" y="99">MEM</text>
          <text x="12" y="123">UP</text><text x="12" y="147">DN</text>
        </g>
        <g fill="#BBD1AB" text-anchor="end">
          <text x="105" y="75">3.6G</text><text x="105" y="99">8.4G</text>
          <text x="148" y="75">18%</text><text x="148" y="99">43%</text>
          <text x="148" y="123">86 KB/s</text><text x="148" y="147">2.4 MB/s</text>
        </g>
      </g>
    </g>
    <use href="#card"/>
  </g>
</svg>
