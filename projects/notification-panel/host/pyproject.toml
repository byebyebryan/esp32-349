[project]
name = "status349"
version = "0.1.0"
description = "Linux host tools for the ESP32-349 notification panel"
requires-python = ">=3.11"
dependencies = [
    "dbus-next>=0.2.3",
    "markdown-it-py==4.2.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
]

[project.scripts]
349ctl = "status349.__main__:main"
349d = "status349.daemon:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/status349"]
