name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Documentation links and presentation provenance
        run: python3 tools/check_docs.py

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: projects/notification-panel/host/uv.lock
          cache-suffix: ${{ matrix.python }}
      - name: Install isolated notification-bus test broker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dbus-broker
      - name: Host and native-check tooling regressions
        working-directory: projects/notification-panel
        env:
          STATUS349_REQUIRE_DBUS_BROKER: "1"
        run: env -u DBUS_SESSION_BUS_ADDRESS uv run --project host --frozen pytest -q host/tests tools/tests

  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Desktop action provider regressions
        working-directory: projects/notification-panel
        run: node integrations/dms/349NotificationActions/tests/provider_core_test.js

  firmware:
    name: Firmware / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [notification-panel, render-bench]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.8.22"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: projects/notification-panel/host/uv.lock
          cache-suffix: native
      - name: Prepare native checks
        if: matrix.project == 'notification-panel'
        working-directory: projects/notification-panel
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake libsdl2-dev pkg-config
          # Keep the cache parent owned by the runner before the container writes SDK files.
          mkdir -p .cache/ci-cjson
      - name: Build firmware with ESP-IDF 5.5.3
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: projects/${{ matrix.project }}
          # Use the same SDK cJSON and locked LVGL sources for the host checks.
          command: |
            idf.py build &&
            if [ -d .cache/ci-cjson ]; then
              cp "$IDF_PATH/components/json/cJSON/cJSON.c" "$IDF_PATH/components/json/cJSON/cJSON.h" .cache/ci-cjson/
            fi
      - name: Shared framebuffer regression
        if: matrix.project == 'notification-panel'
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I components/display_349 \
            components/display_349/shadow_349.c tools/test_shadow_349.c \
            -o "$RUNNER_TEMP/349-shadow-tests"
          "$RUNNER_TEMP/349-shadow-tests"
      - name: Font coverage and metrics
        if: matrix.project == 'notification-panel'
        run: python3 projects/notification-panel/tools/check_font_coverage.py
      - name: Production native checks in Debug and Release
        if: matrix.project == 'notification-panel'
        working-directory: projects/notification-panel
        run: uv run --project host --frozen python tools/check_native_ui.py --cjson-include .cache/ci-cjson
      - name: Benchmark gallery regeneration in Debug and Release
        if: matrix.project == 'render-bench'
        working-directory: projects/render-bench
        run: |
          uv run --no-project --with pillow==12.0.0 python tools/render_presentation.py \
            --build-type Debug --output .cache/presentation/export-debug
          uv run --no-project --with pillow==12.0.0 python tools/render_presentation.py \
            --build-type Release --output .cache/presentation/export-release
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path("docs/media/manifest.json").read_text())
          for name, record in manifest["files"].items():
              for configuration in ("debug", "release"):
                  path = Path(f".cache/presentation/export-{configuration}") / name
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == record["sha256"], path
          print("Benchmark gallery bytes match committed assets in Debug and Release")
          PY
